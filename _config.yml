title: Plastic Skillet Publishing
tagline: Stories that probably shouldn't exist, but do anyway.
description: The literary home of Sensurround Q. Catgirl.
url: "https://books.plasticskillet.com"
baseurl: ""
lang: en
timezone: America/Chicago

# Keep Markdown manuscripts in downloads as files, not generated web pages.
optional_front_matter:
  enabled: false

collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: tabs
    values:
      permalink: /:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.local
  - Gemfile.local.lock
  - vendor
  - tools
  - README.md
  - LICENSE
